server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: sistema

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sistema_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DB_SCHEMA:public}
    open-in-view: false

  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:public}
    default-schema: ${DB_SCHEMA:public}
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:c2lzdGVtYS1zdXBlci1zZWNyZXQta2V5LXBhcmEtand0LXRva2VuLWFzc2luYXR1cmEtZGV2}
    expiration-ms: ${JWT_EXPIRATION_MS:7200000}
  security:
    # Em producao (HTTPS), defina COOKIE_SECURE=true para que o cookie do token
    # so trafegue por conexao criptografada.
    cookie-secure: ${COOKIE_SECURE:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8100,capacitor://localhost,ionic://localhost}
