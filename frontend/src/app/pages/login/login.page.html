<ion-content class="auth-page" [fullscreen]="true">
  <div class="auth-wrapper">
    <ion-card class="auth-card">
      <ion-card-content>
        <div class="brand">
          <div class="brand-logo">
            <ion-icon name="shield-checkmark-outline"></ion-icon>
          </div>
          <h1 class="brand-title">Bem-vindo de volta</h1>
          <p class="brand-subtitle">Entre com sua conta para continuar</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()">
          <ion-item fill="outline" class="ion-margin-bottom">
            <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
            <ion-input
              label="Login"
              labelPlacement="floating"
              formControlName="login"
              type="text"
              autocomplete="username"
            ></ion-input>
          </ion-item>
          <div class="form-error" *ngIf="f.login.touched && f.login.invalid">
            Informe o login.
          </div>

          <ion-item fill="outline" class="ion-margin-top">
            <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
            <ion-input
              label="Senha"
              labelPlacement="floating"
              formControlName="password"
              type="password"
              autocomplete="current-password"
            ></ion-input>
          </ion-item>
          <div class="form-error" *ngIf="f.password.touched && f.password.invalid">
            Informe a senha.
          </div>

          <ion-text color="danger" *ngIf="errorMessage">
            <p class="ion-text-center ion-margin-top error-banner">{{ errorMessage }}</p>
          </ion-text>

          <ion-button
            expand="block"
            type="submit"
            class="ion-margin-top submit-btn"
            [disabled]="loading"
          >
            <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
            <ion-icon *ngIf="!loading" name="log-in-outline" slot="start"></ion-icon>
            Entrar
          </ion-button>

          <p class="ion-text-center ion-margin-top switch-link">
            Ainda nao tem conta?
            <a routerLink="/register">Criar conta</a>
          </p>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
