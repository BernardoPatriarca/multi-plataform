<ion-header class="ion-no-border">
  <ion-toolbar class="form-toolbar">
    <ion-title>{{ isEdit ? 'Editar lancamento' : 'Novo lancamento' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <ion-segment formControlName="tipo" class="tipo-segment">
      <ion-segment-button value="RECEITA">
        <ion-icon name="trending-up-outline"></ion-icon>
        <ion-label>Receita</ion-label>
      </ion-segment-button>
      <ion-segment-button value="DESPESA">
        <ion-icon name="trending-down-outline"></ion-icon>
        <ion-label>Despesa</ion-label>
      </ion-segment-button>
    </ion-segment>

    <p class="section-label">Informacoes gerais</p>

    <ion-grid class="form-grid">
      <ion-row>
        <ion-col size="12">
          <ion-item fill="outline">
            <ion-input label="Descricao" labelPlacement="floating" formControlName="descricao" type="text"></ion-input>
          </ion-item>
          <div class="form-error" *ngIf="f.descricao.touched && f.descricao.invalid">Informe a descricao.</div>
        </ion-col>

        <ion-col size="12" size-md="6">
          <ion-item fill="outline">
            <ion-input label="Valor (R$)" labelPlacement="floating" formControlName="valor" type="number" step="0.01"></ion-input>
          </ion-item>
          <div class="form-error" *ngIf="f.valor.touched && f.valor.invalid">Informe um valor maior que zero.</div>
        </ion-col>
        <ion-col size="12" size-md="6">
          <ion-item fill="outline">
            <ion-input label="Categoria" labelPlacement="floating" formControlName="categoria" type="text"></ion-input>
          </ion-item>
        </ion-col>
      </ion-row>
    </ion-grid>

    <p class="section-label">Pagamento</p>

    <ion-grid class="form-grid">
      <ion-row>
        <ion-col size="12" size-md="6">
          <ion-item fill="outline">
            <ion-select label="Forma de pagamento" labelPlacement="floating" formControlName="formaPagamento" interface="popover">
              <ion-select-option value="">Nao definida</ion-select-option>
              <ion-select-option *ngFor="let fp of formasPagamento" [value]="fp.value">{{ fp.label }}</ion-select-option>
            </ion-select>
          </ion-item>
        </ion-col>
        <ion-col size="12" size-md="6">
          <ion-item fill="outline">
            <ion-select label="Status" labelPlacement="floating" formControlName="status" interface="popover">
              <ion-select-option *ngFor="let s of statusOpcoes" [value]="s.value">{{ s.label }}</ion-select-option>
            </ion-select>
          </ion-item>
        </ion-col>

        <ion-col size="12" size-md="6">
          <ion-item fill="outline">
            <ion-input label="Data de vencimento" labelPlacement="floating" formControlName="dataVencimento" type="date"></ion-input>
          </ion-item>
        </ion-col>
        <ion-col size="12" size-md="6">
          <ion-item fill="outline">
            <ion-input label="Data de pagamento" labelPlacement="floating" formControlName="dataPagamento" type="date"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size="12">
          <ion-item fill="outline">
            <ion-textarea label="Observacoes" labelPlacement="floating" formControlName="observacoes" autoGrow="true"></ion-textarea>
          </ion-item>
        </ion-col>
      </ion-row>
    </ion-grid>

    <p class="form-error banner" *ngIf="errorMessage">{{ errorMessage }}</p>

    <ion-button expand="block" type="submit" class="ion-margin-top submit-btn" [disabled]="loading">
      <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
      <ion-icon *ngIf="!loading" name="save-outline" slot="start"></ion-icon>
      Salvar
    </ion-button>
  </form>
</ion-content>
