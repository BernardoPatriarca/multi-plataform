<ion-content class="auth-page" [fullscreen]="true">
  <div class="auth-wrapper">
    <ion-card class="auth-card">
      <ion-card-content>
        <div class="brand">
          <div class="brand-logo">
            <ion-icon name="person-add-outline"></ion-icon>
          </div>
          <h1 class="brand-title">Criar conta</h1>
          <p class="brand-subtitle">Preencha os dados para se cadastrar</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()">
          <ion-item fill="outline" class="ion-margin-bottom">
            <ion-icon name="id-card-outline" slot="start" color="medium"></ion-icon>
            <ion-input label="Nome completo" labelPlacement="floating" formControlName="nome" type="text" autocomplete="off"></ion-input>
          </ion-item>
          <div class="form-error" *ngIf="f.nome.touched && f.nome.invalid">Informe o nome.</div>

          <ion-item fill="outline" class="ion-margin-top">
            <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
            <ion-input label="Login" labelPlacement="floating" formControlName="login" type="text" autocomplete="off"></ion-input>
          </ion-item>
          <div class="form-error" *ngIf="f.login.touched && f.login.invalid">Informe o login.</div>

          <ion-item fill="outline" class="ion-margin-top">
            <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
            <ion-input label="Email" labelPlacement="floating" formControlName="email" type="email" autocomplete="off"></ion-input>
          </ion-item>
          <div class="form-error" *ngIf="f.email.touched && f.email.invalid">Email invalido.</div>

          <ion-item fill="outline" class="ion-margin-top">
            <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
            <ion-input label="Senha" labelPlacement="floating" formControlName="password" type="password" autocomplete="new-password"></ion-input>
          </ion-item>
          <div class="form-error" *ngIf="f.password.touched && f.password.invalid">
            Senha deve ter no minimo 8 caracteres, com letras e numeros.
          </div>

          <ion-item fill="outline" class="ion-margin-top">
            <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
            <ion-input label="Confirmar senha" labelPlacement="floating" formControlName="confirmPassword" type="password" autocomplete="new-password"></ion-input>
          </ion-item>
          <div class="form-error" *ngIf="f.confirmPassword.touched && form.errors?.['passwordMismatch']">
            As senhas nao coincidem.
          </div>

          <ion-button expand="block" type="submit" class="ion-margin-top submit-btn" [disabled]="loading">
            <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
            <ion-icon *ngIf="!loading" name="person-add-outline" slot="start"></ion-icon>
            Criar conta
          </ion-button>

          <p class="ion-text-center ion-margin-top switch-link">
            Ja tem conta?
            <a routerLink="/login">Entrar</a>
          </p>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
